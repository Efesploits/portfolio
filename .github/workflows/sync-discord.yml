name: Sync Discord clips

# Pulls every video from #past-works into assets/data/work.json and commits it.
# Discord's attachment links are signed and expire after ~24h, so this also acts
# as a refresh — each run rewrites them with fresh ones.

on:
  schedule:
    - cron: '17 */3 * * *'      # every 3 hours
  workflow_dispatch:             # "Run workflow" button for an instant sync
  push:
    paths:
      - 'scripts/sync-config.json'
      - 'scripts/sync-discord.mjs'
      - '.github/workflows/sync-discord.yml'

concurrency:
  group: sync-discord
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      # No setup-node step: the runner already ships a current Node, and pinning
      # 20 only pulled in a deprecated download plus its warnings.
      - name: Pull clips from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/sync-discord.mjs

      # work.json is fully regenerated every run, so on a push race the right move
      # is to take whatever is on the remote now and lay our fresh output back on
      # top — never to drop the clips we just fetched.
      - name: Commit any changes
        id: commit
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          TMP="$(mktemp -d)"
          cp assets/data/work.json "$TMP/work.json"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git reset --hard "origin/$BRANCH"      # keeps untracked downloads
            mkdir -p assets/data
            cp "$TMP/work.json" assets/data/work.json

            if [ -z "$(git status --porcelain)" ]; then
              echo "Nothing changed."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add -A
            git commit -m "Sync clips from Discord #past-works"

            if git push origin "HEAD:$BRANCH"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected - someone pushed first. Rebuilding on the new tip ($attempt/3)."
          done

          echo "Could not push after 3 attempts."
          exit 1

  # A push made with GITHUB_TOKEN deliberately does not trigger other workflows,
  # so the sync commit would never reach Pages via static.yml. Deploy it here.
  # Shares static.yml's "pages" concurrency group so the two can't collide.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
